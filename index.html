  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <!-- Entrar / sin acceso -->
  <main id="acceso" class="acceso" hidden>
    <div class="nav-marca acceso-marca">GIWA <span class="u-c-vi">{IA}</span></div>
    <div class="card acceso-card">
      <span class="acceso-ico" data-ico="candado"></span>
      <h1 id="acceso-tit" class="acceso-tit">CRM interno</h1>
      <p id="acceso-msg" class="acceso-msg"></p>
      <div id="acceso-gis" class="por-gis" hidden></div>
      <button id="acceso-btn" class="btn bg por-ancho por-google" onclick="entrarConGoogle()">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google</button>
      <button id="acceso-salir" class="btn bg sm" onclick="salir()" hidden>Entrar con otra cuenta</button>
    </div>
  </main>

  <!-- La app -->
  <div id="app" hidden>
    <header id="nav-global" class="nav-g">
      <div class="nav-marca">GIWA <span class="u-c-vi">{IA}</span></div>
      <div class="nav-der">
        <span class="u-s11-mt" id="top-fecha"></span>
        <button class="nav-b btn-ico" id="btn-refresh" onclick="recargar()" data-tip="Actualizar datos" aria-label="Actualizar datos"><span data-ico="recargar"></span></button>
        <span class="u-s11-mt-fw6" id="user-lbl-top"></span>
        <button class="nav-b btn-ico" onclick="salir()" data-tip="Cerrar sesión" aria-label="Cerrar sesión"><span data-ico="candado"></span></button>
      </div>
    </header>
    <!-- Menú lateral: módulos y sus subpantallas (acordeón); se colapsa a íconos -->
    <aside class="lat ui-menu" aria-label="Menú">
      <nav id="nav-mods" class="lat-nav" aria-label="Módulos"></nav>
      <button class="lat-tog" id="lat-tog" onclick="alternarMenu()" data-tip="Colapsar el menú" aria-label="Colapsar el menú"><span data-ico="izquierda"></span><span class="lat-txt">Colapsar</span></button>
    </aside>
    <main id="vista" class="vista"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
