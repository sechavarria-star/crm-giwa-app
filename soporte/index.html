<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte · GIWA {IA}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css?v=202611062307">
  <link rel="stylesheet" href="../css/app.css?v=202611062307">
  <link rel="stylesheet" href="../css/tokens.css?v=202611062307">
  <link rel="stylesheet" href="../css/componentes.css?v=202611062307">
</head>
<body>
  <!-- Portal de soporte para los clientes de GIWA. Cada dato pasa por las funciones portal_* de la base:
       la empresa sale del mail con el que entró, nunca de lo que mande el navegador. -->

  <!-- Entrar -->
  <main id="acceso" class="acceso" hidden>
    <div class="nav-marca acceso-marca">GIWA <span class="u-c-vi">{IA}</span></div>
    <div class="card acceso-card">
      <span class="acceso-ico" data-ico="chat"></span>
      <h1 id="acceso-tit" class="acceso-tit">Soporte</h1>
      <p id="acceso-msg" class="acceso-msg">Cargá y seguí tus pedidos de soporte.</p>
      <form id="acceso-form" class="por-form" onsubmit="portalEntrar(event)">
        <input class="fc" id="acceso-mail" type="email" placeholder="Tu mail" aria-label="Tu mail" autocomplete="username" required>
        <input class="fc u-mt6" id="acceso-pass" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
        <button class="btn bp por-ancho u-mt10" id="acceso-entrar" type="submit">Entrar</button>
        <button class="btn bg sm u-mt10" type="button" id="acceso-link" onclick="portalLink()">Olvidé mi contraseña / es mi primera vez</button>
        <div class="por-o">o</div>
        <div id="acceso-gis" class="por-gis" hidden></div>
        <button class="btn bg por-ancho por-google" type="button" id="acceso-google" onclick="portalGoogle()">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continuar con Google</button>
      </form>
      <form id="clave-form" class="por-form" onsubmit="portalClave(event)" hidden>
        <input class="fc" id="clave-1" type="password" placeholder="Contraseña nueva (8 o más caracteres)" aria-label="Contraseña nueva" autocomplete="new-password" minlength="8" required>
        <input class="fc u-mt6" id="clave-2" type="password" placeholder="Repetila" aria-label="Repetí la contraseña" autocomplete="new-password" minlength="8" required>
        <button class="btn bp por-ancho u-mt10" id="clave-ok" type="submit">Guardar y entrar</button>
      </form>
      <button id="acceso-salir" class="btn bg sm" onclick="salir()" hidden>Entrar con otra cuenta</button>
    </div>
  </main>

  <!-- El portal -->
  <div id="app" hidden>
    <header class="nav-g por-nav">
      <div class="u-row8"><div class="nav-marca">GIWA <span class="u-c-vi">{IA}</span></div><span class="por-emp" id="por-emp"></span></div>
      <div class="nav-der">
        <span class="u-s11-mt-fw6" id="por-yo"></span>
        <button class="nav-b btn-ico" onclick="salir()" data-tip="Salir" aria-label="Salir"><span data-ico="candado"></span></button>
      </div>
    </header>
    <div id="por-como" class="por-como" hidden></div>
    <main id="vista" class="vista por-vista"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js?v=202611062307"></script>
  <script src="../js/util.js?v=202611062307"></script>
  <script src="../js/base.js?v=202611062307"></script>
  <script src="../js/iconos.js?v=202611062307"></script>
  <script src="../js/ui.js?v=202611062307"></script>
  <script src="../js/dialogo.js?v=202611062307"></script>
  <script src="../js/calculos.js?v=202611062307"></script>
  <script src="../js/sb.js?v=202611062307"></script>
  <script src="../js/portal.js?v=202611062307"></script>
</body>
</html>
